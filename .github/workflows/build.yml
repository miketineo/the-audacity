name: Build site

# Dependabot PRs used to show green with only the gitleaks scan, even when the
# bump broke the build. This job builds the Zola site with scripts/zola (the Zola
# container, pinned by digest), so a red build blocks a merge.
# It builds only; it never deploys (deploys are the manual direct upload in
# scripts/deploy-pages.sh).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: scripts/zola build
