version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /v2
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
